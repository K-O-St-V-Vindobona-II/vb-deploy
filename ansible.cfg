[defaults]
# No default inventory: a missing "-i inventory/<stage>.ini" should fail
# hard instead of guessing a stage.
# SSH host keys are verified. A new host is trusted on first use (accept-new,
# see ssh_args); a changed key aborts the run.
host_key_checking = True
interpreter_python = auto_silent
# The "yaml" callback plugin is deprecated; the default callback prints YAML too.
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
