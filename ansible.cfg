[defaults]
# No default inventory: a missing "-i <site_dir>/inventory.ini" should fail
# hard instead of guessing a stage.
# SSH host keys are verified. A new host is trusted on first use (accept-new,
# see ssh_args); a changed key aborts the run.
host_key_checking = True
interpreter_python = auto_silent
# The "yaml" callback plugin is deprecated; the default callback prints YAML too.
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
# IdentitiesOnly: offer only the key given with --private-key. The hosts allow
# three authentication attempts, which an SSH agent holding several keys
# would otherwise use up before the right key is tried.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
