# Unix socket: reachable only from inside this container (the socket directory
# is a private tmpfs), so local peers are trusted.
local   all   all                  trust
# TCP: the pod shares one network namespace, so every co-located container
# reaches this server from 127.0.0.1 and must authenticate.
host    all   all   127.0.0.1/32   scram-sha-256
host    all   all   ::1/128        scram-sha-256
host    all   all   all            scram-sha-256
