# Skeleton for the test stage - no VPS of its own yet.
# Before first use: replace the host + all four domains + the ACME contact with real values.

[vps]
CHANGEME.example.invalid

[vps:vars]
app_environment=test
acme_email=CHANGEME@example.invalid
# Optional: Let's Encrypt staging CA while a stage is iterated on (unlimited
# issuance, chain not publicly trusted). Leave it commented out for a run that
# needs a browser-trusted certificate.
#caddy_acme_ca=https://acme-staging-v02.api.letsencrypt.org/directory
api_domain=api-test.CHANGEME.example.invalid
intern_domain=intern-test.CHANGEME.example.invalid
www_domain=www-test.CHANGEME.example.invalid
# S3 API of the stage's own Garage instance (non-production only, see
# README: Garage on Non-Production Stages) - publicly reachable, since
# generate_presigned_url() produces links the browser fetches directly.
storage_domain=storage-test.CHANGEME.example.invalid
