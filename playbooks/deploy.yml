---
# Laufender Betrieb: Secrets, Caddyfile und Quadlets auf dem P-System
# synchron halten + Dienste (neu) starten. Baut KEINE Images, klont KEINE
# App-Repos, restored KEINE Daten - das ist alles nicht mehr Aufgabe dieses
# Playbooks (siehe Plan "Ansible/Deployment neu aufgesetzt" fuer die
# Begruendung: die drei App-Images kommen bereits fertig gebaut aus ghcr.io
# und werden vom bereits aktiven podman-auto-update.timer automatisch
# eingespielt).
#
# Multi-Stage: -i waehlt die Stage, es gibt kein Default-Inventory.
#
# Aufruf: ansible-playbook -i inventory/<stage>.ini playbooks/deploy.yml --ask-vault-pass
#
# Sofort-Deploy statt auf den naechtlichen Auto-Update-Lauf zu warten:
#   ansible-playbook ... --ask-vault-pass --tags deploy-api
#   ansible-playbook ... --ask-vault-pass --tags deploy-intern
#   ansible-playbook ... --ask-vault-pass --tags deploy-www
# (diese Tasks laufen NUR, wenn der jeweilige Tag explizit angegeben wird)

- name: Deploy/Sync auf dem P-System
  hosts: vps
  remote_user: service
  gather_facts: yes
  vars:
    local_secrets_path: "../secrets/{{ app_environment }}"
    local_quadlets_path: "../quadlets"
    local_timers_path: "../systemd-timers"
    local_caddyfile_template: "../config/caddy/Caddyfile.j2"
    local_api_pod_template: "../templates/vb-api.pod.j2"
    local_api_quadlet_template: "../templates/vb-api.container.j2"
    local_pg_quadlet_template: "../templates/vb-api-pg.container.j2"
    local_minio_quadlet_template: "../templates/vb-minio.container.j2"
    local_intern_quadlet_template: "../templates/vb-intern.container.j2"
    local_www_quadlet_template: "../templates/vb-www.container.j2"

    remote_env_dir: "{{ ansible_user_dir }}/.env"
    remote_quadlet_base: "{{ ansible_user_dir }}/.config/containers/systemd"
    remote_systemd_user_dir: "{{ ansible_user_dir }}/.config/systemd/user"
    remote_caddy_config_dir: "{{ ansible_user_dir }}/.config/vb/infrastructure/caddy"
    xdg_runtime_dir: "/run/user/{{ ansible_facts.user_uid }}"

    # Quadlet-Quellordner -> Zielpfad unter remote_quadlet_base, fuer die
    # noch verbliebenen STATISCHEN Quadlet-Dateien (kein Jinja2-Templating
    # noetig). "api" ist bewusst NICHT mehr dabei: vb-api.pod, vb-api.container
    # und vb-api-pg.container sind mittlerweile alle drei Templates (Domain-/
    # Stage-/MinIO-abhaengig) - siehe die eigenen Render-Tasks weiter unten,
    # inkl. der eigenen "vindobona2.at/api"-Verzeichnis-Erstellung dort.
    quadlet_targets:
      - { src: caddy, dest: "vb/infrastructure/caddy" }
      - { src: maintenance, dest: "vb/infrastructure/maintenance" }
      - { src: logging, dest: "vb/logging" }
      - { src: intern, dest: "vindobona2.at/intern" }
      - { src: www, dest: "vindobona2.at/www" }

    # Units, die nach jedem Sync explizit (neu) aktiviert/gestartet werden.
    # Wants=/After= in den .pod-Dateien wirkt nur beim ALLERERSTEN Start
    # eines Pods - laeuft der Haupt-Container (z.B. vb-api.service)
    # bereits, ruehrt Ansibles "state: started" ihn nicht mehr an, und eine
    # zuvor fehlgeschlagene Abhaengigkeit (z.B. vb-api-pg.service)
    # bleibt "failed" haengen, statt erneut versucht zu werden. Deshalb
    # explizit auflisten statt auf die Pod-Abhaengigkeit zu vertrauen.
    # vb-minio nur auf Non-Production-Stages, siehe quadlet_targets oben.
    managed_units: >-
      {{
        [
          'caddy.service', 'logging-dozzle.service', 'vb-api-pg.service',
          'vb-api.service', 'vb-intern.service', 'vb-www.service',
        ] + (['vb-minio.service'] if app_environment != 'production' else [])
      }}

  tasks:
    # ------------------------------------------------------------------
    # 0. Stage validieren
    # ------------------------------------------------------------------
    - name: "Stage validieren"
      tags: [always]
      ansible.builtin.assert:
        that:
          - app_environment in ['test', 'qa', 'production']
        fail_msg: >-
          app_environment muss test, qa oder production sein (aktuell:
          '{{ app_environment }}'). Development-Instanzen laufen nie ueber
          dieses Repo, sondern lokal per eigenen Podman-Quadlets.
        success_msg: "Stage '{{ app_environment }}' ist gueltig."

    # ------------------------------------------------------------------
    # 1. Verzeichnisse sicherstellen
    # ------------------------------------------------------------------
    - name: Verzeichnisstruktur anlegen
      loop:
        - "{{ remote_env_dir }}"
        - "{{ remote_quadlet_base }}"
        - "{{ remote_systemd_user_dir }}"
        - "{{ remote_caddy_config_dir }}"
        - "{{ ansible_user_dir }}/.local/share/caddy/caddy_data"
        - "{{ ansible_user_dir }}/data/vb/{{ app_environment }}/postgres"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"

    - name: MinIO-Datenverzeichnis anlegen (nur Non-Production, siehe README)
      when: app_environment != 'production'
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/data/vb/{{ app_environment }}/minio"
        state: directory
        mode: "0700"

    # Rootless-Podman-Mapping-Fix: ein frisch angelegtes Verzeichnis gehoert
    # "service" im normalen UID-Namespace, der Container sieht darin aber
    # seinen eigenen "postgres"-User (UID 999) in einem gemappten Namespace -
    # ohne diesen Fix scheitert initdb beim allerersten Start mit
    # "Permission denied" (empirisch verifiziert, siehe README). Beide
    # Befehle muessen unter podman unshare laufen, nicht nur der chown -
    # danach gehoert das Verzeichnis der gemappten UID, "service" selbst
    # kann es von aussen nicht mehr anfassen. Auf bereits initialisierten
    # Verzeichnissen ein no-op (chown/chmod sind idempotent).
    - name: Postgres-Datenverzeichnis-Ownership sicherstellen (rootless-Mapping)
      ansible.builtin.command: >-
        podman unshare chown -R 999:999
        {{ ansible_user_dir }}/data/vb/{{ app_environment }}/postgres
      changed_when: false

    - name: Postgres-Datenverzeichnis-Permissions sicherstellen
      ansible.builtin.command: >-
        podman unshare chmod 700
        {{ ansible_user_dir }}/data/vb/{{ app_environment }}/postgres
      changed_when: false

    # ------------------------------------------------------------------
    # 2. Secrets verteilen (ansible-vault-verschluesselt im Repo,
    #    Ansible entschluesselt transparent beim Kopieren/Rendern).
    #    Zwei Paare: statische *.env-Dateien werden 1:1 kopiert,
    #    *.env.j2-Dateien werden zuerst mit den Stage-/Domain-Vars
    #    aus der Inventory gerendert (Vault-Entschluesselung passiert
    #    dabei zuerst, das Jinja2-Templating danach - keine Kollision).
    # ------------------------------------------------------------------
    - name: "*.env aus secrets/<stage>/ finden"
      delegate_to: localhost
      become: no
      ansible.builtin.find:
        paths: "{{ local_secrets_path }}"
        patterns: "*.env"
      register: secret_files

    - name: Secrets nach ~/.env kopieren
      no_log: true
      loop: "{{ secret_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ remote_env_dir }}/{{ item.path | basename }}"
        mode: "0600"

    - name: "*.env.j2 aus secrets/<stage>/ finden"
      delegate_to: localhost
      become: no
      ansible.builtin.find:
        paths: "{{ local_secrets_path }}"
        patterns: "*.env.j2"
      register: secret_templates

    - name: Secret-Templates rendern nach ~/.env
      no_log: true
      loop: "{{ secret_templates.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      ansible.builtin.template:
        src: "{{ item.path }}"
        dest: "{{ remote_env_dir }}/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        mode: "0600"

    # ------------------------------------------------------------------
    # 3. Caddyfile rendern (Hosts kommen aus den Stage-Domain-Vars)
    # ------------------------------------------------------------------
    - name: Caddyfile rendern
      ansible.builtin.template:
        src: "{{ local_caddyfile_template }}"
        dest: "{{ remote_caddy_config_dir }}/Caddyfile"
        mode: "0644"

    # ------------------------------------------------------------------
    # 4. Quadlets synchronisieren
    # ------------------------------------------------------------------
    - name: Quadlet-Verzeichnisse anlegen
      loop: "{{ quadlet_targets }}"
      loop_control:
        label: "{{ item.dest }}"
      ansible.builtin.file:
        path: "{{ remote_quadlet_base }}/{{ item.dest }}"
        state: directory
        mode: "0755"

    - name: Quadlet-Dateien kopieren
      loop: "{{ quadlet_targets }}"
      loop_control:
        label: "{{ item.dest }}"
      ansible.builtin.copy:
        src: "{{ local_quadlets_path }}/{{ item.src }}/"
        dest: "{{ remote_quadlet_base }}/{{ item.dest }}/"
        mode: "0644"

    - name: vindobona2.at/api-Verzeichnis anlegen (nur Templates, kein statischer Copy-Task dafuer)
      ansible.builtin.file:
        path: "{{ remote_quadlet_base }}/vindobona2.at/api"
        state: directory
        mode: "0755"

    - name: API-Pod rendern (Domain kommt aus app_environment, MinIO-Ports nur Non-Production)
      ansible.builtin.template:
        src: "{{ local_api_pod_template }}"
        dest: "{{ remote_quadlet_base }}/vindobona2.at/api/vb-api.pod"
        mode: "0644"

    - name: API-Quadlet rendern
      ansible.builtin.template:
        src: "{{ local_api_quadlet_template }}"
        dest: "{{ remote_quadlet_base }}/vindobona2.at/api/vb-api.container"
        mode: "0644"

    - name: Postgres-Quadlet rendern (Datenpfad kommt aus app_environment)
      ansible.builtin.template:
        src: "{{ local_pg_quadlet_template }}"
        dest: "{{ remote_quadlet_base }}/vindobona2.at/api/vb-api-pg.container"
        mode: "0644"

    - name: MinIO-Quadlet rendern (nur Non-Production; teilt sich vb-api.pod, siehe Pod-Netzwerk-Kommentar dort)
      when: app_environment != 'production'
      ansible.builtin.template:
        src: "{{ local_minio_quadlet_template }}"
        dest: "{{ remote_quadlet_base }}/vindobona2.at/api/vb-minio.container"
        mode: "0644"

    - name: Intern-Quadlet rendern (Description zeigt echte Stage statt hartcodiert "Prod")
      ansible.builtin.template:
        src: "{{ local_intern_quadlet_template }}"
        dest: "{{ remote_quadlet_base }}/vindobona2.at/intern/vb-intern.container"
        mode: "0644"

    - name: www-Quadlet rendern (Description zeigt echte Stage statt hartcodiert "Prod")
      ansible.builtin.template:
        src: "{{ local_www_quadlet_template }}"
        dest: "{{ remote_quadlet_base }}/vindobona2.at/www/vb-www.container"
        mode: "0644"

    - name: Systemd-Timer kopieren (kein Quadlet, eigener Zielpfad)
      ansible.builtin.copy:
        src: "{{ local_timers_path }}/"
        dest: "{{ remote_systemd_user_dir }}/"
        mode: "0644"

    # ------------------------------------------------------------------
    # 5. Neue/geaenderte Units bekannt machen
    # ------------------------------------------------------------------
    - name: systemctl --user daemon-reload
      ansible.builtin.systemd:
        scope: user
        daemon_reload: yes
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    # ------------------------------------------------------------------
    # 6. Dienste + Timer (neu) starten/aktivieren
    # ------------------------------------------------------------------
    - name: Dienste aktivieren + starten
      loop: "{{ managed_units }}"
      ansible.builtin.systemd:
        scope: user
        name: "{{ item }}"
        enabled: yes
        state: started
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: podman-prune.timer aktivieren + starten
      ansible.builtin.systemd:
        scope: user
        name: podman-prune.timer
        enabled: yes
        state: started
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    # ------------------------------------------------------------------
    # 7. Optionaler Sofort-Deploy (nur bei explizitem --tags)
    # ------------------------------------------------------------------
    - name: "Sofort-Deploy vb-api: Image pullen"
      tags: [never, deploy-api]
      ansible.builtin.command: podman pull ghcr.io/k-o-st-v-vindobona-ii/vb-api:latest
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: true

    - name: "Sofort-Deploy vb-api: Pod neu starten"
      # NICHT vb-api.service direkt neu starten: der Container ist
      # per generiertem BindsTo= an vb-api-pod.service gebunden -
      # ein Container-Restart stoppt (und entfernt) dabei den ganzen Pod,
      # aber nichts startet den Pod danach von selbst wieder ("Dependency
      # failed", empirisch verifiziert). Der Pod-Service selbst zieht
      # beim Neustart alle enthaltenen Container ueber Wants=/Before=
      # korrekt wieder hoch.
      tags: [never, deploy-api]
      ansible.builtin.systemd:
        scope: user
        name: vb-api-pod.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: "Sofort-Deploy vb-intern: Image pullen"
      tags: [never, deploy-intern]
      ansible.builtin.command: podman pull ghcr.io/k-o-st-v-vindobona-ii/vb-intern:latest
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: true

    - name: "Sofort-Deploy vb-intern: Pod neu starten"
      # Siehe Kommentar bei vb-api oben - Pod-Service statt Container-Service.
      tags: [never, deploy-intern]
      ansible.builtin.systemd:
        scope: user
        name: vb-intern-pod.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: "Sofort-Deploy vb-www: Image pullen"
      tags: [never, deploy-www]
      ansible.builtin.command: podman pull ghcr.io/k-o-st-v-vindobona-ii/vb-www:latest
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: true

    - name: "Sofort-Deploy vb-www: Pod neu starten"
      # Siehe Kommentar bei vb-api oben - Pod-Service statt Container-Service.
      tags: [never, deploy-www]
      ansible.builtin.systemd:
        scope: user
        name: vb-www-pod.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
