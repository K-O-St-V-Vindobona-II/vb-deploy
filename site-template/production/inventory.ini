# Skeleton for the production stage. Copy the whole stage directory into the
# private site repository, then replace every CHANGEME with a real value.

[vps]
CHANGEME.example.invalid

[vps:vars]
app_environment=production
acme_email=CHANGEME@example.invalid
api_domain=api.CHANGEME.example.invalid
intern_domain=intern.CHANGEME.example.invalid
www_domain=www.CHANGEME.example.invalid
# Host the object storage serves presigned image and media URLs from; the
# Content-Security-Policy of the Caddyfile allows images and media from it.
storage_public_origin=https://CHANGEME-bucket.s3.amazonaws.com
# Public keys that may log in as admin and service. setup_vps.yml installs
# exactly these keys for both users and removes every other key. Public keys
# only: the playbook rejects anything else. Add a second entry to give another
# operator access; remove an entry to take access away.
operator_public_keys=["ssh-ed25519 CHANGEME operator"]
