# Skeleton for the QA stage - no VPS of its own yet.
# Before first use: replace the host + all four domains + the ACME contact + the
# operator key with real values.

[vps]
CHANGEME.example.invalid

[vps:vars]
app_environment=qa
acme_email=CHANGEME@example.invalid
api_domain=api-qa.CHANGEME.example.invalid
intern_domain=intern-qa.CHANGEME.example.invalid
www_domain=www-qa.CHANGEME.example.invalid
# S3 API of the stage's own Garage instance (non-production only, see
# README section 5.4, Garage on non-production stages) - publicly reachable, since
# generate_presigned_url() produces links the browser fetches directly.
storage_domain=storage-qa.CHANGEME.example.invalid
# Free disk space (GiB) required before the first deploy: the stage mirrors the
# whole production bucket (README 5.1). Set 0 on a throwaway server that never
# runs a downsync.
#min_free_disk_gb=60
# Public keys that may log in as admin and service. setup_vps.yml installs
# exactly these keys for both users and removes every other key. Public keys
# only: the playbook rejects anything else.
operator_public_keys=["ssh-ed25519 CHANGEME operator"]
